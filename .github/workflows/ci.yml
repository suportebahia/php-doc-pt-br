name: CI - Integridade da Skill

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validar Estrutura e Links da Skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl

      - name: Validar Sintaxe dos Arquivos Markdown e Links Canônicos
        run: |
          echo "Verificando se todos os arquivos obrigatórios existem..."
          test -f "SKILL.md" || exit 1
          test -f "AGENTS.md" || exit 1
          test -f "CLAUDE.md" || exit 1
          test -f ".cursorrules" || exit 1
          test -f "README.md" || exit 1
          test -f "LICENSE" || exit 1
          echo "Todos os arquivos centrais existem!"
          
          echo "Validando links para o manual oficial do PHP..."
          php -r '
            $arquivos = glob("references/*.md");
            $linksInvalidos = 0;
            foreach ($arquivos as $arq) {
                $conteudo = file_get_contents($arq);
                preg_match_all("/https:\/\/www\.php\.net\/manual\/pt_BR\/[^\)\s]+/", $conteudo, $matches);
                foreach ($matches[0] as $link) {
                    if (str_contains($link, "example.com")) continue;
                    // Valida formato de URL canônica do manual
                    if (!preg_match("/^https:\/\/www\.php\.net\/manual\/pt_BR\/[a-zA-Z0-9_\-\.\#]+$/", $link)) {
                        echo "Alerta de link malformado em $arq: $link\n";
                    }
                }
            }
            echo "Varredura de links canônicos concluída com sucesso!\n";
          '
