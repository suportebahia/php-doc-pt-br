name: CI - Integridade e Evals da Skill

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validar Estrutura, Links e Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, fileinfo

      - name: Validar Existência dos Arquivos Obrigatórios de Governança
        run: |
          echo "Verificando arquivos estruturais e de governança..."
          test -f "SKILL.md" || exit 1
          test -f "AGENTS.md" || exit 1
          test -f "CLAUDE.md" || exit 1
          test -f ".cursorrules" || exit 1
          test -f "README.md" || exit 1
          test -f "LICENSE" || exit 1
          test -f "CONTRIBUTING.md" || exit 1
          test -f "SECURITY.md" || exit 1
          test -f "CODE_OF_CONDUCT.md" || exit 1
          test -f "tests/evals/README.md" || exit 1
          echo "Todos os arquivos centrais e de governança foram verificados!"

      - name: Validar Schema dos Casos de Teste (JSON)
        run: |
          php tests/evals/run-evals.php --validate-only

      - name: Executar Test Harness de Evals (Fixtures Canônicas)
        run: |
          php tests/evals/run-evals.php

      - name: Validar Links Canônicos para o Manual Oficial (PHP.net)
        run: |
          php -r '
            $arquivos = glob("references/*.md");
            $erros = 0;
            foreach ($arquivos as $arq) {
                $conteudo = file_get_contents($arq);
                preg_match_all("/https:\/\/www\.php\.net\/manual\/pt_BR\/[^\)\s\"]+/", $conteudo, $matches);
                foreach ($matches[0] as $link) {
                    if (str_contains($link, "example.com")) continue;
                    // Validação robusta com filter_var e prefixo canônico:
                    if (!filter_var($link, FILTER_VALIDATE_URL) || !str_starts_with($link, "https://www.php.net/manual/pt_BR/")) {
                        echo "Alerta de link inválido em $arq: $link\n";
                        $erros++;
                    }
                }
            }
            if ($erros > 0) {
                echo "Total de links com problemas: $erros\n";
                exit(1);
            }
            echo "Todos os links canônicos foram validados com sucesso!\n";
          '
