name: Verificações

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar com PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Verificar sintaxe PHP
        run: |
          set -euo pipefail
          php -l tests/evals/run-evals.php
          php -l tests/evals/test-runner.php
          php -l tests/evals/validate-links.php
          find tests/evals/fixtures -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Validar casos e executar verificações estáticas
        run: |
          php tests/evals/run-evals.php --validate-only
          php tests/evals/run-evals.php
          php tests/evals/test-runner.php

      - name: Validar formato e domínio dos links
        run: php tests/evals/validate-links.php
